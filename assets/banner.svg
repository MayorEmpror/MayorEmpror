<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Hashir Ali — Full-Stack Developer and Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111c34"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1090" cy="70" r="190" fill="#38bdf8" opacity="0.10"/>
  <circle cx="1180" cy="250" r="140" fill="#34d399" opacity="0.08"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <text x="72" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Hashir Ali</text>
  <text x="74" y="184" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="500" fill="#94a3b8" letter-spacing="0.4">Full-Stack Developer &amp; Software Engineer</text>

  <rect x="72" y="212" width="132" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="72" y="258" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="500" fill="#7dd3fc" letter-spacing="0.6">React · Next.js · TypeScript · Node.js · PostgreSQL · Docker</text>
  <text x="72" y="288" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748b" letter-spacing="0.4">Crafting digital excellence — from concept to production.</text>
</svg>
